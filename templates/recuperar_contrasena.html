<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='tipografia.css') }}">
  <title>Recuperar contraseña</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='inicio_de_sesion.css') }}">
</head>
<body class="login-page">
  <main class="login-wrap">
    <section class="login-card">
      <div class="login-form-panel">
        <p class="eyebrow">Acceso al sistema</p>
        <h1>Recuperar contraseña</h1>
        <p class="login-intro login-help">Escribe el correo electrónico o número de teléfono asociado a tu cuenta.</p>
        <form method="post">
          <label>
            Correo electrónico o teléfono
            <input name="identifier" required autocomplete="email">
          </label>
          {% if recovery_message %}
            <p class="login-success">{{ recovery_message }}</p>
          {% endif %}
          <button class="primary-button" type="submit">Enviar enlace</button>
          <a class="secondary-link" href="{{ url_for('connection_status') }}">Volver al inicio de sesión</a>
        </form>
      </div>
      <aside class="login-brand-panel" aria-label="Identidad del sistema">
        <div class="brand-logo-frame">
          <img class="brand-logo" src="{{ url_for('static', filename='imagenes/logo verde.png') }}" alt="Logotipos institucionales">
        </div>
        <p class="brand-kicker">Sistema</p>
        <h2>Programación<br>de controladores</h2>
        <p class="brand-caption">Red de Transporte de Pasajeros</p>
      </aside>
    </section>
  </main>
</body>
</html>
