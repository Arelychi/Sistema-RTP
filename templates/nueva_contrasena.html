<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='tipografia.css') }}">
  <title>Nueva contraseña</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='inicio_de_sesion.css') }}">
</head>
<body class="login-page">
  <main class="login-wrap">
    <section class="login-card">
      <p class="eyebrow">Acceso al sistema</p>
      <h1>Nueva contraseña</h1>
      {% if reset_success %}
        <p class="login-success">{{ reset_success }}</p>
        <a class="secondary-link" href="{{ url_for('connection_status') }}">Ir al inicio de sesión</a>
      {% else %}
        <form method="post">
          <label>
            Nueva contraseña
            <input name="password" type="password" minlength="8" required autocomplete="new-password">
          </label>
          <label>
            Confirmar contraseña
            <input name="password_confirmation" type="password" minlength="8" required autocomplete="new-password">
          </label>
          {% if reset_error %}
            <p class="login-error">{{ reset_error }}</p>
          {% endif %}
          <button class="primary-button" type="submit">Guardar contraseña</button>
        </form>
      {% endif %}
    </section>
  </main>
</body>
</html>
