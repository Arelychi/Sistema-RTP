<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='tipografia.css') }}">
  <title>Turnos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='turnos.css') }}">
</head>
<body class="module-page catalog-page" data-module="{{ module_number }}">
  <main class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><img class="module-brand-logo" src="{{ url_for('static', filename='imagenes/logo_blanco_1.png') }}" alt="Logo RTP"><h2>Programación de Controladores</h2><button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Cerrar menú lateral" aria-expanded="true" title="Cerrar menú lateral"><span data-sidebar-icon aria-hidden="true">‹</span></button></div>
      <nav>
      
        <a  href="{{ url_for('schedule_dashboard', module_number=module_number) }}">Programación de tiempo</a>
        <a href="{{ url_for('module_dashboard', module_number=module_number) }}">Creación de controladores</a>
        <a href="{{ url_for('routes_dashboard', module_number=module_number) }}">Rutas</a>
        <a class="active" href="{{ url_for('more_dashboard', module_number=module_number) }}">Turnos</a>
      </nav>
      <div class="sidebar-module"><form method="post" action="{{ url_for('logout') }}"><button type="submit"><span class="logout-icon" aria-hidden="true">↪</span><span>Cerrar sesión</span></button></form></div>
    </aside>

    <section class="main-content">
      <header class="content-header">
        <div><p class="eyebrow">Asignación</p><h1>Turnos</h1><p class="subtitle">{{ module_name or 'Módulo ' ~ module_number }} | {{ account.username }}</p></div>
        <div class="connection is-online"><span class="connection-dot"></span>Conectado</div>
      </header>

      <div class="catalog-grid shift-selection-grid">
        <section class="card catalog-card">
          <div class="card-heading"><div><span class="step-number">01</span><h2>Turnos disponibles</h2></div><span id="turnos-count" class="record-count">0 turnos</span></div>
          <div id="turnos-options" class="shift-options" aria-live="polite"></div>
          <p id="turnos-feedback" class="shift-history-feedback" role="status" aria-live="polite" hidden></p>
        </section>

        <section class="card catalog-card">
          <div class="card-heading"><div><span class="step-number">02</span><h2>Turnos elegidos</h2></div><span id="selected-count" class="record-count">0 turnos</span></div>
          <div class="table-container"><table class="selected-shifts-table"><thead><tr><th>Turno</th><th>Inicio</th><th>Fin</th></tr></thead><tbody id="selected-turnos-body"></tbody></table></div>
        </section>
      </div>
    </section>
  </main>
<script>
const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character]));
let availableShifts = [];
const storageKey = `selected-shifts-${document.body.dataset.module}`;
const availableShiftsStorageKey = `available-shifts-${document.body.dataset.module}`;
const storedAvailableShiftIds = localStorage.getItem(availableShiftsStorageKey);
let selectedShiftIds = new Set(JSON.parse(localStorage.getItem(storageKey) || '[]').map(String));
let knownAvailableShiftIds = new Set(JSON.parse(storedAvailableShiftIds || '[]').map(String));
let hasAvailabilityState = storedAvailableShiftIds !== null;
async function loadShifts() {
  const response = await fetch('/api/catalogos/turnos');
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'No se pudieron cargar los turnos.');
  availableShifts = data.filter((shift) => shift.activo);
  const availableShiftIds = new Set(availableShifts.map((shift) => String(shift.id)));
  if (!hasAvailabilityState) {
    selectedShiftIds = new Set(availableShiftIds);
  } else {
    availableShiftIds.forEach((id) => {
      if (!knownAvailableShiftIds.has(id)) selectedShiftIds.add(id);
    });
  }
  selectedShiftIds = new Set([...selectedShiftIds].filter((id) => availableShiftIds.has(id)));
  knownAvailableShiftIds = availableShiftIds;
  localStorage.setItem(storageKey, JSON.stringify([...selectedShiftIds]));
  localStorage.setItem(availableShiftsStorageKey, JSON.stringify([...knownAvailableShiftIds]));
  hasAvailabilityState = true;
  renderShifts();
}
function renderShifts() {
  document.getElementById('turnos-count').textContent = `${availableShifts.length} ${availableShifts.length === 1 ? 'turno' : 'turnos'}`;
  document.getElementById('turnos-options').innerHTML = availableShifts.length ? availableShifts.map((shift) => {
    const shiftId = String(shift.id);
    return `<label class="shift-option"><input type="checkbox" data-shift-id="${shiftId}" ${selectedShiftIds.has(shiftId) ? 'checked' : ''}><span class="shift-checkmark" aria-hidden="true"></span><span class="shift-option-copy"><strong>Turno ${escapeHtml(shift.numero)}</strong><small>${escapeHtml(shift.hora_inicio)} - ${escapeHtml(shift.hora_fin)}</small></span></label>`;
  }).join('') : '<p class="empty-table">No hay turnos disponibles.</p>';
  const selected = availableShifts.filter((shift) => selectedShiftIds.has(String(shift.id)));
  document.getElementById('selected-count').textContent = `${selected.length} ${selected.length === 1 ? 'turno' : 'turnos'}`;
  document.getElementById('selected-turnos-body').innerHTML = selected.length ? selected.map((shift) => `<tr><td>Turno ${escapeHtml(shift.numero)}</td><td>${escapeHtml(shift.hora_inicio)}</td><td>${escapeHtml(shift.hora_fin)}</td></tr>`).join('') : '<tr><td colspan="3" class="empty-table">Selecciona uno o más turnos.</td></tr>';
}
function setShiftFeedback(message, isError = false) {
  const feedback = document.getElementById('turnos-feedback');
  feedback.textContent = message;
  feedback.hidden = !message;
  feedback.classList.toggle('is-error', isError);
}
async function recordDiscardedShift(shiftId) {
  const response = await fetch(`/api/turnos/${encodeURIComponent(shiftId)}/descartar`, {
    method: 'POST',
    headers: { 'Accept': 'application/json' }
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || 'No se pudo registrar el turno descartado.');
}
async function recordAddedShift(shiftId) {
  const response = await fetch(`/api/turnos/${encodeURIComponent(shiftId)}/agregar`, {
    method: 'POST',
    headers: { 'Accept': 'application/json' }
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || 'No se pudo registrar el turno agregado.');
}
document.getElementById('turnos-options').addEventListener('change', async (event) => {
  const checkbox = event.target.closest('input[data-shift-id]');
  if (!checkbox) return;
  const shiftId = checkbox.dataset.shiftId;
  if (checkbox.checked) {
    const shift = availableShifts.find((item) => String(item.id) === shiftId);
    checkbox.disabled = true;
    setShiftFeedback('Registrando turno agregado...');
    try {
      await recordAddedShift(shiftId);
      selectedShiftIds.add(shiftId);
      localStorage.setItem(storageKey, JSON.stringify([...selectedShiftIds]));
      renderShifts();
      setShiftFeedback(`Agregaste el turno ${shift?.numero || ''}.`);
    } catch (error) {
      checkbox.checked = false;
      checkbox.disabled = false;
      setShiftFeedback(error.message, true);
    }
    return;
  }
  const shift = availableShifts.find((item) => String(item.id) === shiftId);
  checkbox.disabled = true;
  setShiftFeedback('Registrando turno descartado...');
  try {
    await recordDiscardedShift(shiftId);
    selectedShiftIds.delete(shiftId);
    localStorage.setItem(storageKey, JSON.stringify([...selectedShiftIds]));
    renderShifts();
    setShiftFeedback(`Descartaste el turno ${shift?.numero || ''}.`);
  } catch (error) {
    checkbox.checked = true;
    checkbox.disabled = false;
    setShiftFeedback(error.message, true);
  }
});
loadShifts().catch((error) => { document.getElementById('turnos-options').innerHTML = `<p class="empty-table">${escapeHtml(error.message)}</p>`; });
</script>
</body>
<script src="{{ url_for('static', filename='sidebar.js') }}"></script>
</html>
